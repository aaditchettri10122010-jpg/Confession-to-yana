<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine Ask</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="envelope-container">
        <img id="envelope" src="envelope.png" alt="Envelope" />
    </div>

    <div id="letter-container">
        <div class="letter-window">
            <h1 id="letter-title">Will you be my Valentine?</h1>
            <p id="letter-text">Click the envelope to see your surprise.</p>
            <img id="letter-cat" class="cat" src="cat.png" alt="Cute cat" />

            <div id="letter-buttons" class="buttons">
                <div class="no-wrapper">
                    <img class="btn no-btn" src="no.png" alt="No" />
                </div>
                <img class="btn yes-btn" src="yes.png" alt="Yes" />
            </div>

            <div id="final-text" class="final-text">
                Thank you! I’m so happy you said yes.
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
